spring.application.name=ai-quota-backend
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=always

# --- Seguridad / identidad ---
# Secreto HMAC para firmar los tokens de sesion. En produccion DEBE definirse APP_TOKEN_SECRET.
# Si no se define, se genera uno aleatorio al arrancar (los tokens dejan de ser validos al reiniciar).
app.security.token-secret=${APP_TOKEN_SECRET:}

# --- CORS ---
# Lista separada por comas de origenes permitidos (ej. https://mi-frontend.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Servicio de IA simulado ---
app.ai.mock-delay-ms=${AI_MOCK_DELAY_MS:1200}

# --- Zona horaria de los resets (cuota mensual / historial diario) ---
app.time-zone=${APP_TIME_ZONE:America/Bogota}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Herramienta de demostración POST /api/quota/simulate-usage (solo afecta al propio usuario)
app.demo-tools=${APP_DEMO_TOOLS:true}
